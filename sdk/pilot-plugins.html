<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Halcón · piloto de plugins sobre el shim</title>
    <link rel="stylesheet" href="vendor/zorzal/src/zorzal.css" />
    <style>
      :root {
        --borde: #d7dce3;
      }

      body {
        margin: 0;
        background: #f6f7f9;
        color: #1d2430;
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      .barra {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
        align-items: baseline;
        padding: 12px 20px;
        background: #1d2430;
        color: #f6f7f9;
      }

      .barra__nota {
        font-size: 12px;
        color: #b7c0cc;
      }

      .pagina {
        max-width: 980px;
        margin: 0 auto;
        padding: 18px 20px 48px;
      }

      .estado {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        margin-bottom: 18px;
        padding: 12px 14px;
        border: 1px solid var(--borde);
        border-left: 4px solid #b7791f;
        border-radius: 8px;
        background: #fffdf7;
      }

      .estado[data-estado="ok"] {
        border-left-color: #1f9d55;
        background: #f4fbf7;
      }

      .estado[data-estado="error"] {
        border-left-color: #c0392b;
        background: #fdf5f4;
      }

      .estado__punto {
        flex: 0 0 auto;
        width: 10px;
        height: 10px;
        margin-top: 6px;
        border-radius: 50%;
        background: #b7791f;
      }

      .estado[data-estado="ok"] .estado__punto {
        background: #1f9d55;
      }

      .estado[data-estado="error"] .estado__punto {
        background: #c0392b;
      }

      .estado__texto {
        font-weight: 600;
      }

      .estado__detalle {
        margin: 4px 0 0;
        padding: 0;
        list-style: none;
        font-size: 12px;
        color: #3d4757;
      }

      .estado__detalle li {
        margin-top: 2px;
      }

      .estado__detalle li[data-ok="no"] {
        color: #c0392b;
      }

      .panel {
        border: 1px solid var(--borde);
        border-radius: 8px;
        background: #fff;
        overflow: hidden;
        margin-bottom: 18px;
      }

      .panel__titulo {
        margin: 0;
        padding: 8px 12px;
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #5b6676;
        border-bottom: 1px solid var(--borde);
        background: #f0f3f6;
      }

      .acciones {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-bottom: 18px;
      }

      .acciones button {
        padding: 6px 12px;
        border: 1px solid var(--borde);
        border-radius: 6px;
        background: #fff;
        font: inherit;
        cursor: pointer;
      }

      .acciones button:hover {
        background: #eef2f6;
      }

      .acciones__nota {
        font-size: 12px;
        color: #5b6676;
      }

      /* Ajustes de presentacion del piloto: el shim no aplica `css` ni `width`
         de la config heredada. */
      #app .z-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        background: #1d2430;
        color: #f6f7f9;
      }

      #app .main-toolbar .z-toolbar__button {
        color: #f6f7f9;
        background: #2c3646;
        border-color: #3d4757;
      }

      #app .main-toolbar .z-template:has(.z-template__content:empty) {
        flex: 1 1 auto;
      }

      #app .main-toolbar .z-template__content {
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      #app .main_logo--collapsed .z-template__content {
        font-size: 12px;
      }

      #app .toolbar-interior {
        background: #f0f3f6;
        color: #1d2430;
        border-bottom: 1px solid var(--borde);
      }

      #app .toolbar-interior .z-toolbar__button {
        color: #1d2430;
        background: #fff;
        border-color: var(--borde);
      }

      #app .z-form {
        padding: 12px 16px;
        gap: 10px;
      }

      #app .z-datatable {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <header class="barra">
      <strong>Halcón · piloto de plugins</strong>
      <span class="barra__nota">mainbar + formview + datalist sobre el shim de Zorzal. Sin Webix.</span>
    </header>

    <main class="pagina">
      <section class="estado" id="estado" data-estado="cargando">
        <span class="estado__punto"></span>
        <div>
          <div class="estado__texto" id="estado-texto">Montando los tres widgets...</div>
          <ul class="estado__detalle" id="estado-detalle"></ul>
        </div>
      </section>

      <div class="acciones">
        <button type="button" id="probar-guardado">Probar guardado del formview</button>
        <button type="button" id="probar-export">Probar export_to_excel</button>
        <span class="acciones__nota" id="acciones-nota"></span>
      </div>

      <section class="panel">
        <h1 class="panel__titulo">mainbar</h1>
        <div id="app"></div>
      </section>
    </main>

    <script type="module">
      import { webix } from './compat/webix-shim.js';
      import { installGlobals, __ } from './compat/globals.js';
      import './compat/plugins/mainbar.js';
      import './compat/plugins/formview.js';
      import './compat/plugins/datalist.js';

      installGlobals(window);

      const estado = document.getElementById('estado');
      const estadoTexto = document.getElementById('estado-texto');
      const estadoDetalle = document.getElementById('estado-detalle');
      const accionesNota = document.getElementById('acciones-nota');

      const pasos = [];

      /**
       * @param {boolean} ok
       * @param {string} texto
       */
      function paso(ok, texto) {
        pasos.push({ ok, texto });
        const li = document.createElement('li');
        li.dataset.ok = ok ? 'si' : 'no';
        li.textContent = `${ok ? 'ok' : 'falla'} · ${texto}`;
        estadoDetalle.appendChild(li);
        return ok;
      }

      function cerrarEstado() {
        const fallas = pasos.filter((item) => !item.ok);
        estado.dataset.estado = fallas.length === 0 ? 'ok' : 'error';
        estadoTexto.textContent =
          fallas.length === 0
            ? `Resultado: los tres plugins montaron (${pasos.length} verificaciones)`
            : `Resultado: ${fallas.length} de ${pasos.length} verificaciones fallaron`;
      }

      function fallar(mensaje) {
        paso(false, mensaje);
        cerrarEstado();
      }

      window.addEventListener('error', (event) => {
        fallar(`error de pagina: ${event.message}`);
      });

      window.addEventListener('unhandledrejection', (event) => {
        fallar(`promesa rechazada: ${String(event.reason)}`);
      });

      const personas = [
        { id: 1, nombre: 'Ana Perez', area: 'Sistemas', alta: '2024-03-01' },
        { id: 2, nombre: 'Bruno Diaz', area: 'Compras', alta: '2023-11-14' },
        { id: 3, nombre: 'Carla Gomez', area: 'Legales', alta: '2025-01-20' },
      ];

      let guardado = 'sin probar';

      try {
        paso(webix.isDefined('mainbar'), 'kind mainbar registrado');
        paso(webix.isDefined('formview'), 'kind formview registrado');
        paso(webix.isDefined('datalist'), 'kind datalist registrado');

        webix.ui(
          {
            view: 'layout',
            rows: [
              {
                id: 'barra',
                view: 'mainbar',
              },
              {
                id: 'form_persona',
                view: 'formview',
                store: 'persona',
                title_add: 'Nueva persona',
                title_set: 'Editar persona',
                source: '/api/persona',
                dataview: 'lista_personas',
                update: 'persona_update',
                validate: true,
                elements: [
                  { view: 'text', name: 'nombre', label: 'Nombre', value: 'Ana Perez', placeholder: 'Nombre y apellido' },
                  { view: 'text', name: 'area', label: 'Area', value: 'Sistemas', placeholder: 'Area' },
                ],
                on: {
                  onFormSubmmited: (values) => {
                    guardado = `onFormSubmmited con ${Object.keys(values || {}).length} claves`;
                    accionesNota.textContent = guardado;
                  },
                  formReady: () => {
                    accionesNota.textContent = 'formReady emitido por formview';
                  },
                },
              },
              {
                id: 'lista',
                view: 'datalist',
                store: 'personas',
                title: 'Personas',
                form: 'form_persona',
                data_type: 'datatable',
                data_id: 'tabla_personas',
                columns: [
                  { id: 'nombre', header: 'Nombre', width: 220 },
                  { id: 'area', header: 'Area', width: 180 },
                  { id: 'alta', header: 'Alta', width: 140 },
                ],
                json: personas,
              },
            ],
          },
          '#app'
        );

        paso(true, 'layout montado en #app');

        setTimeout(() => {
          const barra = webix.$$('barra');
          paso(Boolean(barra), 'mainbar resuelto por $$("barra")');
          if (barra) {
            paso(barra.kind === 'mainbar', `barra.kind = ${barra.kind}`);
            const botones = barra.el.querySelectorAll('.z-toolbar__button').length;
            paso(botones === 2, `mainbar con ${botones} botones de accion`);
          }

          const logo = webix.$$('_mb_logo');
          paso(Boolean(logo), 'logo del mainbar resuelto por $$("_mb_logo")');
          if (logo) {
            const texto = logo.el.textContent.trim();
            paso(texto === 'DEMO', `logo muestra "${texto}"`);
          }

          const form = webix.$$('persona_form');
          paso(Boolean(form), 'formview monto el formulario persona_form');
          if (form) {
            paso(form.kind === 'form', `persona_form.kind = ${form.kind}`);
            const valores = typeof form.getValues === 'function' ? form.getValues() : {};
            paso(valores.nombre === 'Ana Perez', `valor inicial de nombre = ${JSON.stringify(valores.nombre)}`);
          }

          const titulo = webix.$$('persona_title');
          paso(Boolean(titulo), 'titulo del formview resuelto');
          if (titulo) {
            const texto = titulo.el.textContent.trim();
            paso(texto === 'Nueva persona', `titulo = "${texto}"`);
          }

          const guardar = webix.$$('persona_btn');
          paso(Boolean(guardar), 'boton de guardado resuelto');
          if (guardar) {
            paso(!guardar.el.hasAttribute('disabled'), 'boton de guardado habilitado por $ready');
          }

          const tabla = webix.$$('tabla_personas');
          paso(Boolean(tabla), 'datalist monto la tabla tabla_personas');
          if (tabla) {
            paso(tabla.kind === 'datatable', `tabla_personas.kind = ${tabla.kind}`);
            paso(tabla.count === personas.length, `filas cargadas = ${tabla.count}`);
          }

          if (tabla) {
            const fila = tabla.el.querySelector('tbody tr');
            if (fila) fila.click();
            paso(Boolean(fila), 'fila de la tabla clickeada');
            paso(Boolean(__.current.personas), 'evento select del datalist actualizo __.current');
          }

          // Con ?probar=1 el piloto ejercita los dos flujos de escritura:
          // el guardado del formview y la exportacion (no-op) del datalist.
          const probar = new URLSearchParams(location.search).get('probar') === '1';
          if (probar) {
            const guardar = webix.$$('persona_btn');
            if (guardar) {
              guardar.click();
              paso(guardado.startsWith('onFormSubmmited'), `guardado del formview: ${guardado}`);
            }

            const lista = webix.$$('lista');
            const exportado = lista && typeof lista.export_to_excel === 'function' ? lista.export_to_excel() : null;
            paso(exportado === false, `export_to_excel devolvio ${String(exportado)}`);

            const accion = webix.$$('_main_btn_action');
            if (accion) {
              accion.click();
              const logo = webix.$$('_mb_logo');
              const colapsado = logo ? logo.el.textContent.trim() : '';
              paso(colapsado === 'GN', `mainbar colapso el logo a "${colapsado}"`);

              accion.click();
              const restaurado = webix.$$('_mb_logo');
              const texto = restaurado ? restaurado.el.textContent.trim() : '';
              paso(texto === 'DEMO', `mainbar restauro el logo a "${texto}"`);
            }
          }

          // Verificacion visible del cambio de iconos: los botones de la
          // mainbar y de las toolbars de los plugins dibujan svg del set de
          // Zorzal, y no queda ningun elemento i.fa.
          const iconosSvg = document.querySelectorAll('#app svg.hc-icon');
          paso(iconosSvg.length >= 6, `iconos svg en los plugins = ${iconosSvg.length}`);
          const iconosFa = document.querySelectorAll('#app i.fa');
          paso(iconosFa.length === 0, `elementos i.fa en los plugins = ${iconosFa.length}`);

          cerrarEstado();
        }, 250);
      } catch (error) {
        fallar(`excepcion al montar: ${error instanceof Error ? error.message : String(error)}`);
      }

      document.getElementById('probar-guardado').addEventListener('click', () => {
        const guardar = webix.$$('persona_btn');
        if (!guardar) {
          accionesNota.textContent = 'el boton de guardado no esta montado';
          return;
        }
        guardar.click();
        accionesNota.textContent = guardado;
      });

      document.getElementById('probar-export').addEventListener('click', () => {
        const lista = webix.$$('lista');
        if (!lista || typeof lista.export_to_excel !== 'function') {
          accionesNota.textContent = 'la vista datalist no expone export_to_excel';
          return;
        }
        const resultado = lista.export_to_excel();
        accionesNota.textContent = `export_to_excel devolvio ${String(resultado)}`;
      });
    </script>
  </body>
</html>
